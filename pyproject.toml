[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "broom"
version = "0.2.dev0"
description = "Tools for working with BVH motion data."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
ik = [
    "torch",
]
all = [
    "torch",
]
test = [
    "pytest",
]

[tool.setuptools]
packages = [
    "broom",
    "broom.bvh",
    "broom.bvh.analysis",
    "broom.bvh.filtering",
    "broom.bvh.in_place",
    "broom.bvh.interpolation",
    "broom.bvh.ops",
    "broom.bvh.render",
    "broom.bvh.retargeting",
    "broom.bvh.rotations",
]

[tool.setuptools.package-dir]
broom = "."

[tool.setuptools.package-data]
"broom.bvh" = ["data/*.json"]
